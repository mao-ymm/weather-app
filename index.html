<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14245e">
  <meta name="description" content="天気から今日の服装を秒で提案する服予報">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="服予報">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>服予報</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-sky="night">
  <div class="sky" aria-hidden="true"><svg id="scene" viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice"></svg></div>

  <main id="app">
    <header class="top">
      <button class="place" id="placeBtn" aria-label="場所を変更">
        <svg viewBox="0 0 24 24" class="pin" aria-hidden="true"><path d="M12 21.5s-7-6.1-7-11.8a7 7 0 1 1 14 0c0 5.7-7 11.8-7 11.8z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="9.7" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span id="placeName">服予報</span>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="設定">⚙︎</button>
    </header>

    <section id="setup" class="card" hidden>
      <h2>まずは場所を教えてください</h2>
      <p class="muted">天気に合わせて、毎日の服装を提案します。</p>
      <button class="primary wide" id="useGeo">📍 現在地を使う</button>
      <p class="or">または</p>
      <form id="searchForm" class="search">
        <input id="searchInput" type="search" placeholder="市区町村名（例：渋谷）" autocomplete="off" enterkeyhint="search">
        <button type="submit" class="secondary">検索</button>
      </form>
      <p class="muted small" id="setupMsg"></p>
      <ul id="searchResults" class="results"></ul>
      <button class="link" id="cancelSetup" hidden>← 戻る</button>
    </section>

    <section id="loading" class="loading" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p>空模様を確認中…</p>
    </section>

    <section id="error" class="card" hidden>
      <p id="errorMsg"></p>
      <button class="primary wide" id="retryBtn">もう一度試す</button>
      <button class="link" id="errorChangePlace">場所を変更する</button>
    </section>

    <section id="result" hidden>
      <div class="hero">
        <div class="hero-temp" id="heroTemp"></div>
        <div class="hero-cond" id="heroCond"></div>
        <div class="hero-sub"><span id="heroHiLo"></span><span id="heroFeels"></span></div>
      </div>

      <article class="card outfit">
        <p class="card-label" id="outfitLabel"></p>
        <div class="outfit-main">
          <div class="emoji" id="outfitEmoji"></div>
          <div>
            <h2 id="outfitTitle"></h2>
            <p class="temp-line" id="tempLine"></p>
          </div>
        </div>
        <ul class="chips" id="outfitItems"></ul>
        <ul class="extras" id="extras"></ul>
      </article>

      <article class="card">
        <p class="card-head" id="hourSummary"></p>
        <div class="hour-scroll"><div class="hour-track" id="hourTrack"></div></div>
      </article>

      <article class="card compare">
        <p class="card-label" id="cmpTitle"></p>
        <div class="cmp-row">
          <p id="cmpText"></p>
          <p class="cmp-value" id="cmpValue"></p>
        </div>
      </article>

      <article class="card daily"><ul id="dailyList"></ul></article>

      <article class="card feedback">
        <p class="fb-q">今日の服装、どうだった？</p>
        <div class="fb-buttons">
          <button data-fb="cold">🥶<span>寒かった</span></button>
          <button data-fb="ok">😊<span>ちょうど</span></button>
          <button data-fb="hot">🥵<span>暑かった</span></button>
        </div>
        <p class="fb-msg" id="fbMsg"></p>
      </article>

      <p class="updated" id="updated"></p>
    </section>

    <footer>
      <a href="https://open-meteo.com/" target="_blank" rel="noopener">Weather data by Open-Meteo.com</a>
    </footer>
  </main>

  <dialog id="settings">
    <form method="dialog" id="settingsForm">
      <h2>設定</h2>
      <fieldset>
        <legend>体感タイプ</legend>
        <div class="seg">
          <label><input type="radio" name="bodyType" value="-2"><span>寒がり</span></label>
          <label><input type="radio" name="bodyType" value="0"><span>ふつう</span></label>
          <label><input type="radio" name="bodyType" value="2"><span>暑がり</span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>外出時間帯</legend>
        <div class="time-range">
          <select name="startHour" aria-label="開始時刻"></select>
          <span>〜</span>
          <select name="endHour" aria-label="終了時刻"></select>
        </div>
      </fieldset>
      <p class="muted small" id="learnedHint"></p>
      <button type="button" class="link" id="resetLearned">学習した補正をリセット</button>
      <button type="button" class="secondary wide" id="changePlace">📍 場所を変更</button>
      <div class="dialog-actions">
        <button value="cancel" class="secondary">閉じる</button>
        <button value="save" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
