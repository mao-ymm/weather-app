<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe6">
  <meta name="description" content="天気から今日の服装を秒で提案する服予報">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="服予報">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>服予報</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-mood="mild">
  <main id="app">
    <header class="top">
      <div>
        <p class="eyebrow" id="dayLabel">服予報</p>
        <h1 id="placeName">何着よう？</h1>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="設定">⚙︎</button>
    </header>

    <section id="setup" class="panel" hidden>
      <h2>まずは場所を教えてください</h2>
      <p class="muted">天気に合わせて、毎日の服装を提案します。</p>
      <button class="primary wide" id="useGeo">📍 現在地を使う</button>
      <p class="or">または</p>
      <form id="searchForm" class="search">
        <input id="searchInput" type="search" placeholder="市区町村名（例：渋谷）" autocomplete="off" enterkeyhint="search">
        <button type="submit" class="secondary">検索</button>
      </form>
      <p class="muted small" id="setupMsg"></p>
      <ul id="searchResults" class="results"></ul>
      <button class="link" id="cancelSetup" hidden>← 戻る</button>
    </section>

    <section id="loading" class="loading" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p>空模様を確認中…</p>
    </section>

    <section id="error" class="panel" hidden>
      <p id="errorMsg"></p>
      <button class="primary wide" id="retryBtn">もう一度試す</button>
      <button class="link" id="errorChangePlace">場所を変更する</button>
    </section>

    <section id="result" hidden>
      <article class="outfit-card">
        <div class="emoji" id="outfitEmoji"></div>
        <h2 id="outfitTitle"></h2>
        <p class="temp-line" id="tempLine"></p>
        <ul class="chips" id="outfitItems"></ul>
      </article>

      <ul class="extras" id="extras"></ul>

      <h3 class="section-title" id="hoursTitle">外出時間帯の天気</h3>
      <div class="hours" id="hours"></div>

      <section class="feedback">
        <p>今日の服装、どうだった？</p>
        <div class="fb-buttons">
          <button data-fb="cold">🥶<span>寒かった</span></button>
          <button data-fb="ok">😊<span>ちょうど</span></button>
          <button data-fb="hot">🥵<span>暑かった</span></button>
        </div>
        <p class="fb-msg" id="fbMsg"></p>
      </section>

      <p class="updated" id="updated"></p>
    </section>

    <footer>
      <a href="https://open-meteo.com/" target="_blank" rel="noopener">Weather data by Open-Meteo.com</a>
    </footer>
  </main>

  <dialog id="settings">
    <form method="dialog" id="settingsForm">
      <h2>設定</h2>
      <fieldset>
        <legend>体感タイプ</legend>
        <div class="seg">
          <label><input type="radio" name="bodyType" value="-2"><span>寒がり</span></label>
          <label><input type="radio" name="bodyType" value="0"><span>ふつう</span></label>
          <label><input type="radio" name="bodyType" value="2"><span>暑がり</span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>外出時間帯</legend>
        <div class="time-range">
          <select name="startHour" aria-label="開始時刻"></select>
          <span>〜</span>
          <select name="endHour" aria-label="終了時刻"></select>
        </div>
      </fieldset>
      <p class="muted small" id="learnedHint"></p>
      <button type="button" class="link" id="resetLearned">学習した補正をリセット</button>
      <button type="button" class="secondary wide" id="changePlace">📍 場所を変更</button>
      <div class="dialog-actions">
        <button value="cancel" class="secondary">閉じる</button>
        <button value="save" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
