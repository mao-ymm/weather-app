<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14245e">
  <meta name="description" content="天気から今日の服装を秒で提案する服予報">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="服予報">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>服予報</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body data-sky="night">
  <div class="sky" aria-hidden="true"><svg id="scene" viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice"></svg></div>

  <main id="app">
    <header class="top">
      <button class="place" id="placeBtn" aria-label="場所を変更">
        <span class="place-sub" id="placeSub"></span>
        <span class="place-name" id="placeName">服予報</span>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="設定"></button>
    </header>

    <section id="setup" class="card pad" hidden>
      <h2>場所を設定</h2>
      <p class="muted">天気に合わせて、毎日の服装を提案します。</p>
      <button class="primary wide" id="useGeo">現在地を使う</button>
      <p class="or">または</p>
      <form id="searchForm" class="search">
        <input id="searchInput" type="search" placeholder="市区町村名（例：渋谷）" autocomplete="off" enterkeyhint="search">
        <button type="submit" class="secondary">検索</button>
      </form>
      <p class="muted small" id="setupMsg"></p>
      <ul id="searchResults" class="results"></ul>
      <button class="link" id="cancelSetup" hidden>戻る</button>
    </section>

    <section id="loading" class="loading" hidden>
      <div class="spinner" aria-hidden="true"></div>
    </section>

    <section id="error" class="card pad" hidden>
      <p id="errorMsg"></p>
      <button class="primary wide" id="retryBtn">もう一度試す</button>
      <button class="link" id="errorChangePlace">場所を変更する</button>
    </section>

    <section id="result" hidden>
      <div class="hero">
        <div class="hero-temp" id="heroTemp"></div>
        <div class="hero-cond" id="heroCond"></div>
        <div class="hero-hilo" id="heroHiLo"></div>
      </div>

      <article class="card outfit">
        <div class="card-top">
          <p class="card-label" id="outfitLabel"></p>
          <div class="seg-mini" role="tablist" aria-label="表示する日">
            <button data-day="today" role="tab">今日</button>
            <button data-day="tomorrow" role="tab">明日</button>
          </div>
        </div>
        <div class="outfit-main">
          <div class="badge" id="outfitIcon"></div>
          <div>
            <h2 id="outfitTitle"></h2>
            <p class="outfit-sub" id="outfitSub"></p>
          </div>
        </div>
        <ul class="chips" id="outfitItems"></ul>
        <ul class="extras" id="extras"></ul>
      </article>

      <article class="card">
        <p class="card-label" id="hourLabel"></p>
        <p class="card-summary" id="hourSummary"></p>
        <div class="hour-scroll"><div class="hour-track" id="hourTrack"></div></div>
      </article>

      <article class="card">
        <p class="card-label" id="dailyLabel"></p>
        <ul class="daily" id="dailyList"></ul>
      </article>

      <div class="grid2">
        <article class="card tile">
          <p class="card-label" id="cmpLabel"></p>
          <p class="tile-value" id="cmpValue"></p>
          <p class="tile-text" id="cmpText"></p>
        </article>
        <article class="card tile">
          <p class="card-label" id="feelsLabel"></p>
          <p class="tile-value" id="feelsValue"></p>
          <p class="tile-text" id="feelsText"></p>
        </article>
      </div>

      <article class="card pad feedback">
        <p class="fb-q">今日の服装、どうだった？</p>
        <div class="segmented" id="fbButtons">
          <button data-fb="cold">寒かった</button>
          <button data-fb="ok">ちょうどいい</button>
          <button data-fb="hot">暑かった</button>
        </div>
        <p class="fb-msg" id="fbMsg"></p>
      </article>

      <p class="updated" id="updated"></p>
    </section>

    <footer>
      <a href="https://open-meteo.com/" target="_blank" rel="noopener">Weather data by Open-Meteo.com</a>
    </footer>
  </main>

  <dialog id="settings">
    <form method="dialog" id="settingsForm">
      <h2>設定</h2>
      <fieldset>
        <legend>体感タイプ</legend>
        <div class="seg">
          <label><input type="radio" name="bodyType" value="-2"><span>寒がり</span></label>
          <label><input type="radio" name="bodyType" value="0"><span>ふつう</span></label>
          <label><input type="radio" name="bodyType" value="2"><span>暑がり</span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>外出時間帯</legend>
        <div class="time-range">
          <select name="startHour" aria-label="開始時刻"></select>
          <span>〜</span>
          <select name="endHour" aria-label="終了時刻"></select>
        </div>
      </fieldset>
      <p class="muted small" id="learnedHint"></p>
      <button type="button" class="link" id="resetLearned">学習した補正をリセット</button>
      <button type="button" class="secondary wide" id="changePlace">場所を変更</button>
      <div class="dialog-actions">
        <button value="cancel" class="secondary">閉じる</button>
        <button value="save" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
